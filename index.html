<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cubic Bezier Curve Editor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>bezier-curve-editor</h1>
            <span class="subtitle">Timing Function Inspector</span>
        </header>

        <main class="workspace">
            <section class="canvas-section">
                <div class="canvas-container">
                    <canvas id="bezierCanvas" width="400" height="400"></canvas>
                </div>
                <div class="canvas-controls">
                    <button id="btnPlay" class="btn primary">Replay Animation</button>
                    <button id="btnReset" class="btn secondary">Reset</button>
                </div>
            </section>

            <aside class="sidebar">
                <div class="panel">
                    <h2>Presets</h2>
                    <div class="preset-grid">
                        <button class="btn preset" data-p1x="0.25" data-p1y="0.1" data-p2x="0.25" data-p2y="1.0">ease</button>
                        <button class="btn preset" data-p1x="0.42" data-p1y="0.0" data-p2x="1.0" data-p2y="1.0">ease-in</button>
                        <button class="btn preset" data-p1x="0.0" data-p1y="0.0" data-p2x="0.58" data-p2y="1.0">ease-out</button>
                        <button class="btn preset" data-p1x="0.42" data-p1y="0.0" data-p2x="0.58" data-p2y="1.0">ease-in-out</button>
                        <button class="btn preset" data-p1x="0.0" data-p1y="0.0" data-p2x="1.0" data-p2y="1.0">linear</button>
                    </div>
                </div>

                <div class="panel">
                    <h2>Control Points</h2>
                    <div class="control-group">
                        <label>P1 X: <span id="valP1X">0.25</span></label>
                        <input type="range" id="rangeP1X" min="-0.5" max="1.5" step="0.01" value="0.25">
                    </div>
                    <div class="control-group">
                        <label>P1 Y: <span id="valP1Y">0.10</span></label>
                        <input type="range" id="rangeP1Y" min="-1.0" max="2.0" step="0.01" value="0.1">
                    </div>
                    <div class="control-group">
                        <label>P2 X: <span id="valP2X">0.25</span></label>
                        <input type="range" id="rangeP2X" min="-0.5" max="1.5" step="0.01" value="0.25">
                    </div>
                    <div class="control-group">
                        <label>P2 Y: <span id="valP2Y">1.00</span></label>
                        <input type="range" id="rangeP2Y" min="-1.0" max="2.0" step="0.01" value="1.0">
                    </div>
                </div>

                <div class="panel">
                    <h2>Live Preview</h2>
                    <div class="preview-stage" id="previewStage">
                        <div class="preview-box" id="previewBox"></div>
                    </div>
                </div>

                <div class="panel">
                    <h2>Export CSS</h2>
                    <div class="code-output">
                        <code id="cssOutput">transition: transform 600ms cubic-bezier(0.25, 0.1, 0.25, 1);</code>
                        <button id="btnCopy" class="btn secondary">Copy Code</button>
                    </div>
                </div>
            </aside>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
